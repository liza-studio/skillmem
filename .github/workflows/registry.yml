name: mcp-registry

# The official MCP Registry is the canonical index for MCP servers, and several
# third-party directories pull from it. Publishing by hand needs an interactive
# device-code login, which means it silently rots; this runs as the repository
# itself via GitHub OIDC, so every tag keeps the listing honest.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC — no stored registry credential
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check server.json points at the tag
        run: |
          python3 - <<'PY'
          import json, os, sys
          d = json.load(open("server.json"))
          # Only a tag run has a version to agree with; a manual run publishes
          # whatever server.json currently says, which is the point of the button.
          tag = (os.environ.get("GITHUB_REF_NAME", "")
                 if os.environ.get("GITHUB_REF_TYPE") == "tag" else "")
          want = tag[1:] if tag.startswith("v") else tag
          got = {d.get("version")} | {p.get("version") for p in d.get("packages", [])}
          if want and got != {want}:
              sys.exit(f"server.json says {got}, tag says {want} — refusing to "
                       "advertise a version the registry cannot install")
          print("server.json and the tag agree:", want or d.get("version"))
          PY
      - name: Wait for the version to appear on PyPI
        # The registry verifies the package exists before it will list it, and this
        # job runs alongside the PyPI publish — without the wait the tag run loses
        # the race and the listing silently stays a version behind.
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, sys
          want = json.load(open("server.json"))["version"]
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(
                          "https://pypi.org/pypi/skillmem/json", timeout=15) as r:
                      if want in json.load(r)["releases"]:
                          print(f"{want} is on PyPI (attempt {attempt + 1})")
                          sys.exit(0)
              except Exception as exc:
                  print("pypi check failed:", exc)
              time.sleep(20)
          sys.exit(f"{want} never appeared on PyPI — not registering it")
          PY

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher --version
      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
