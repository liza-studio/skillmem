<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 698 822" width="698" height="822" font-family="ui-monospace,SFMono-Regular,Menlo,DejaVu Sans Mono,monospace" font-size="13">
<rect width="698" height="822" rx="10" fill="#0d1117"/>
<rect width="698" height="30" rx="10" fill="#161b22"/>
<rect y="20" width="100%" height="10" fill="#161b22"/>
<circle cx="20" cy="15" r="5" fill="#ff5f56"/>
<circle cx="38" cy="15" r="5" fill="#ffbd2e"/>
<circle cx="56" cy="15" r="5" fill="#27c93f"/>
<text x="349" y="19" fill="#7d8590" font-size="11" text-anchor="middle">skillmem</text>
<text x="18" y="44" fill="#7d8590" xml:space="preserve" opacity="0"># Session one. The agent just spent an hour on a bug. It writes down how.<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.0001;0.0101;1"/></text>
<text x="18" y="63" fill="#56b6c2" xml:space="preserve" opacity="0">$ skillmem learn skill-sqlite-locked \<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.0203;0.0303;1"/></text>
<text x="18" y="82" fill="#56b6c2" xml:space="preserve" opacity="0">    --title SQLite &#x27;database is locked&#x27; under concurrent writers \<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.0405;0.0505;1"/></text>
<text x="18" y="101" fill="#56b6c2" xml:space="preserve" opacity="0">    --trigger sqlite3.OperationalError: database is locked in a worker \<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.0608;0.0708;1"/></text>
<text x="18" y="120" fill="#56b6c2" xml:space="preserve" opacity="0">    --steps Enable WAL (PRAGMA journal_mode=WAL) and set busy_timeout=5000 \<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.0810;0.0910;1"/></text>
<text x="18" y="139" fill="#56b6c2" xml:space="preserve" opacity="0">    --outcome success \<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.1013;0.1113;1"/></text>
<text x="18" y="158" fill="#56b6c2" xml:space="preserve" opacity="0">    --lessons Default rollback journal serialises writers; WAL lets readers through<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.1215;0.1315;1"/></text>
<text x="18" y="177" fill="#e6edf3" xml:space="preserve" opacity="0">Learned: skill-sqlite-locked (id=1)<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.1418;0.1518;1"/></text>
<text x="18" y="215" fill="#7d8590" xml:space="preserve" opacity="0"># Session two, fresh context. It knows nothing — except what it recalls.<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.1823;0.1923;1"/></text>
<text x="18" y="234" fill="#56b6c2" xml:space="preserve" opacity="0">$ skillmem recall worker crashes with database is locked --limit 1 --no-reinforce<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.2025;0.2125;1"/></text>
<text x="18" y="253" fill="#e6edf3" xml:space="preserve" opacity="0">  [skill-sqlite-locked] SQLite &#x27;database is locked&#x27; under concurrent writers<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.2228;0.2328;1"/></text>
<text x="18" y="272" fill="#e6edf3" xml:space="preserve" opacity="0">    strength=1.00 █████  access=0  fresh<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.2430;0.2530;1"/></text>
<text x="18" y="291" fill="#e6edf3" xml:space="preserve" opacity="0">    **trigger:** sqlite3.OperationalError: database is locked in a worker<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.2633;0.2733;1"/></text>
<text x="18" y="310" fill="#e6edf3" xml:space="preserve" opacity="0">    **steps:** Enable WAL (PRAGMA journal_mode=WAL) and set busy_timeout=5000<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.2835;0.2935;1"/></text>
<text x="18" y="329" fill="#e6edf3" xml:space="preserve" opacity="0">    **outcome:** success<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.3038;0.3138;1"/></text>
<text x="18" y="348" fill="#e6edf3" xml:space="preserve" opacity="0">    **lessons:** Default rollback journal serialises writers; WAL lets readers through<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.3241;0.3341;1"/></text>
<text x="18" y="386" fill="#7d8590" xml:space="preserve" opacity="0"># Did it actually help? Saying so is not evidence. Strength does not move.<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.3646;0.3746;1"/></text>
<text x="18" y="405" fill="#56b6c2" xml:space="preserve" opacity="0">$ skillmem reinforce skill-sqlite-locked<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.3848;0.3948;1"/></text>
<text x="18" y="424" fill="#e6edf3" xml:space="preserve" opacity="0">Reinforced: skill-sqlite-locked strength=1.00 access=1 evidence=self_report<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.4051;0.4151;1"/></text>
<text x="18" y="462" fill="#7d8590" xml:space="preserve" opacity="0"># The test passing is evidence. Now it moves.<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.4456;0.4556;1"/></text>
<text x="18" y="481" fill="#56b6c2" xml:space="preserve" opacity="0">$ skillmem reinforce skill-sqlite-locked --evidence test_passed<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.4658;0.4758;1"/></text>
<text x="18" y="500" fill="#e6edf3" xml:space="preserve" opacity="0">Reinforced: skill-sqlite-locked strength=1.15 access=2 evidence=test_passed<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.4861;0.4961;1"/></text>
<text x="18" y="538" fill="#7d8590" xml:space="preserve" opacity="0"># And a rule that is rare by nature must not fade for being unused.<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.5266;0.5366;1"/></text>
<text x="18" y="557" fill="#56b6c2" xml:space="preserve" opacity="0">$ skillmem pin skill-sqlite-locked<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.5468;0.5568;1"/></text>
<text x="18" y="576" fill="#e6edf3" xml:space="preserve" opacity="0">pinned: skill-sqlite-locked<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.5671;0.5771;1"/></text>
<text x="18" y="614" fill="#7d8590" xml:space="preserve" opacity="0"># Other people&#x27;s skill packs live here too, by the same rules.<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.6076;0.6176;1"/></text>
<text x="18" y="633" fill="#56b6c2" xml:space="preserve" opacity="0">$ skillmem skills add DietrichGebert/ponytail<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.6278;0.6378;1"/></text>
<text x="18" y="671" fill="#e6edf3" xml:space="preserve" opacity="0">imported 6 skills from ponytail (licence: MIT License)<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.6684;0.6784;1"/></text>
<text x="18" y="709" fill="#56b6c2" xml:space="preserve" opacity="0">$ skillmem skills ls<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.7089;0.7189;1"/></text>
<text x="18" y="728" fill="#e6edf3" xml:space="preserve" opacity="0">pack                     skills  strength  confirmed  failures  archived<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.7291;0.7391;1"/></text>
<text x="18" y="747" fill="#e6edf3" xml:space="preserve" opacity="0">ponytail                      6      1.00          0         0         0<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.7494;0.7594;1"/></text>
<text x="18" y="785" fill="#7d8590" xml:space="preserve" opacity="0"># One database. Six agents. Nothing left the machine.<animate attributeName="opacity" dur="15.80s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.7899;0.7999;1"/></text>
</svg>